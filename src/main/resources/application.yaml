server:
  port: 8093

spring:
  config:
    import: optional:file:.env[.properties]   # solo para correr desde el IDE
  application:
    name: ms-vidasalud-rabbit-admin

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI:api://${AZURE_CLIENT_ID}}

  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        path-segment: 1   # /api/{version}/...
      supported: 1

  rabbitmq:
    # Nodos del clúster RabbitMQ (host:puerto separados por coma). Si el nodo actual cae,
    # el cliente se reconecta al siguiente de la lista.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS}
    connection-timeout: 3s

vidasalud:
  rabbit:
    # Recursos del sistema (los declara ms-vidasalud-notify). No se pueden eliminar desde esta API.
    protegidas:
      - q.cmd.email
      - q.cmd.admission
      - q.cmd.record
      - q.cmd.email.dlq
      - q.cmd.admission.dlq
      - q.cmd.record.dlq
      - cmd.direct
      - cmd.topic
      - cmd.fanout
      - cmd.dead.dlx

management:
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness y /actuator/health/readiness
