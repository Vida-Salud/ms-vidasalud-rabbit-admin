server:
  port: 8093

spring:
  application:
    name: ms-vidasalud-rabbit-admin

  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:9832f4f3-52dd-4367-a3b0-b4437d223f58}
        credential:
          client-id: ${AZURE_CLIENT_ID:c0093a05-7296-42f7-b6e7-d263c3db2fb0}
        app-id-uri: ${AZURE_APP_ID_URI:api://c0093a05-7296-42f7-b6e7-d263c3db2fb0}

  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    # Nodos del clúster RabbitMQ (host:puerto separados por coma). Si el nodo actual cae,
    # el cliente se reconecta al siguiente de la lista.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS:admin123}
    connection-timeout: 3s

vidasalud:
  rabbit:
    # Recursos del sistema (los declara ms-vidasalud-notify). No se pueden eliminar desde esta API.
    protegidas:
      - q.cmd.email
      - q.cmd.admission
      - q.cmd.record
      - q.cmd.email.dlq
      - q.cmd.admission.dlq
      - q.cmd.record.dlq
      - cmd.direct
      - cmd.topic
      - cmd.fanout
      - cmd.dead.dlx
